services:

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >
      bash -ec "python scripts/apply_schema.py &&
               python manage.py migrate --settings=config.settings_migrate --noinput &&
               python manage.py warmup_denylist &&
               python manage.py collectstatic --noinput"
    volumes:
      - ./backend:/app
      - ./database/migrations:/app/database/migrations:ro
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      - DJANGO_DEBUG=False
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - redis

  django:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 config.wsgi:application
    volumes:
      - ./backend:/app
      - ./database/migrations:/app/database/migrations:ro
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      - DJANGO_DEBUG=False
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  fastapi:
    build:
      context: ./backend
      dockerfile: fast_lane/Dockerfile
    volumes:
      - ./backend:/app
    environment:
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A config worker -l info --concurrency=2
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - django
      - redis

  celery_beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - django
      - redis

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/static
      - media_volume:/app/media:ro
    depends_on:
      - django
      - fastapi
      - frontend

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=production
    depends_on:
      - django

volumes:
  redis_data:
  static_volume:
  media_volume:
