services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >
      bash -ec "python scripts/apply_schema.py &&
                python manage.py migrate --settings=config.settings_migrate --noinput &&
                python manage.py warmup_denylist &&
                python manage.py collectstatic --noinput"
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - SCHEMA_MIGRATION_BASELINE=${SCHEMA_MIGRATION_BASELINE:-}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-sua-chave-secreta-aqui}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-seu-dominio.com,localhost}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/1}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/1}
    depends_on:
      - redis
    restart: "no"

  django:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 config.wsgi:application
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      # Standalone PostgreSQL 17 + PostGIS & Auth Nativo
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super-secret-jwt-token-with-at-least-32-characters-long}
      
      # Backend (Django & Celery)
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-sua-chave-secreta-aqui}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-seu-dominio.com,localhost}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://seu-dominio.com,http://localhost:5173}
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-True}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/1}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/1}
      
      # Integrações e IA
      - GEMINI_API_KEY=${GEMINI_API_KEY:-sua-chave-gemini}
      - GOOGLE_MAPS_PLATFORM_KEY=${GOOGLE_MAPS_PLATFORM_KEY:-sua-chave-maps}
      
      # Evolution API
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-https://evo.seu-dominio.com}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-sua-global-api-key}
      - EVOLUTION_INSTANCE_NAME=${EVOLUTION_INSTANCE_NAME:-sua-instancia}
      - EVOLUTION_INSTANCE_TOKEN=${EVOLUTION_INSTANCE_TOKEN:-seu-token-de-instancia}
      
      # Mobile (NevesGo)
      - NEVESGO_API_BASE_URL=${NEVESGO_API_BASE_URL:-https://api.seu-dominio.com/api/v1/}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  fastapi:
    build:
      context: ./backend
      dockerfile: fast_lane/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super-secret-jwt-token-with-at-least-32-characters-long}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/1}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-sua-chave-gemini}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A config worker -l info --concurrency=2
    environment:
      # Standalone PostgreSQL 17 + PostGIS & Auth Nativo
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super-secret-jwt-token-with-at-least-32-characters-long}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-sua-chave-secreta-aqui}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-seu-dominio.com,localhost}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://seu-dominio.com,http://localhost:5173}
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-True}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/1}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/1}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-sua-chave-gemini}
      - GOOGLE_MAPS_PLATFORM_KEY=${GOOGLE_MAPS_PLATFORM_KEY:-sua-chave-maps}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-https://evo.seu-dominio.com}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-sua-global-api-key}
      - EVOLUTION_INSTANCE_NAME=${EVOLUTION_INSTANCE_NAME:-sua-instancia}
      - EVOLUTION_INSTANCE_TOKEN=${EVOLUTION_INSTANCE_TOKEN:-seu-token-de-instancia}
      - NEVESGO_API_BASE_URL=${NEVESGO_API_BASE_URL:-https://api.seu-dominio.com/api/v1/}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  celery_beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A config beat -l info
    environment:
      # Idem ao worker
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super-secret-jwt-token-with-at-least-32-characters-long}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-sua-chave-secreta-aqui}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-seu-dominio.com,localhost}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://seu-dominio.com,http://localhost:5173}
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-True}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/1}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/1}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-sua-chave-gemini}
      - GOOGLE_MAPS_PLATFORM_KEY=${GOOGLE_MAPS_PLATFORM_KEY:-sua-chave-maps}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-https://evo.seu-dominio.com}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-sua-global-api-key}
      - EVOLUTION_INSTANCE_NAME=${EVOLUTION_INSTANCE_NAME:-sua-instancia}
      - EVOLUTION_INSTANCE_TOKEN=${EVOLUTION_INSTANCE_TOKEN:-seu-token-de-instancia}
      - NEVESGO_API_BASE_URL=${NEVESGO_API_BASE_URL:-https://api.seu-dominio.com/api/v1/}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    expose:
      - "80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/static
    depends_on:
      - django
      - fastapi
      - frontend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      # Frontend (Vite/React)
      - VITE_API_URL=${VITE_API_URL:-https://api.seu-dominio.com}
      - PORT=${PORT:-5173}
      - NODE_ENV=${NODE_ENV:-production}
    expose:
      - "5173"
    depends_on:
      - django

volumes:
  redis_data:
  static_volume:
  media_volume:
