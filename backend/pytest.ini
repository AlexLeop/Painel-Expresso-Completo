[pytest]
DJANGO_SETTINGS_MODULE = tests.test_settings
testpaths = tests accounts finance integration logistics todos
python_files = tests.py test_*.py *_tests.py
addopts = -v --tb=short -p tests.gdal_mock_plugin
pythonpath = .
norecursedirs = .git .pytest_cache .venv __pycache__ scripts
markers =
    vps_db: external VPS database checks; requires RUN_LIVE_VPS_TESTS=1 and LIVE_VPS_DATABASE_URL
