<script>
        // Micro-interaction for the button
        document.querySelector('button').addEventListener('click', function() {
            this.style.transform = 'scale(0.95)';
            setTimeout(() => {
                this.style.transform = 'scale(1)';
            }, 150);
        });

        // Add a subtle particle effect for the success state
        function createParticle() {
            const particle = document.createElement('div');
            const size = Math.random() * 6 + 2;
            const container = document.querySelector('main');
            
            particle.style.position = 'absolute';
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.backgroundColor = '#6bff8f';
            particle.style.borderRadius = '50%';
            particle.style.opacity = '0.4';
            particle.style.pointerEvents = 'none';
            
            const startX = Math.random() * window.innerWidth;
            const startY = window.innerHeight;
            
            particle.style.left = `${startX}px`;
            particle.style.top = `${startY}px`;
            
            container.appendChild(particle);
            
            const duration = Math.random() * 3000 + 2000;
            const destinationY = -100;
            const drift = (Math.random() - 0.5) * 200;
            
            particle.animate([
                { transform: `translate(0, 0)`, opacity: 0.4 },
                { transform: `translate(${drift}px, ${destinationY - startY}px)`, opacity: 0 }
            ], {
                duration: duration,
                easing: 'cubic-bezier(0,0,0.2,1)'
            }).onfinish = () => particle.remove();
        }

        // Periodically create particles
        setInterval(createParticle, 500);
    </script>
