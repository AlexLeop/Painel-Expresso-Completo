<script>
        // Micro-interaction for the save button
        const saveBtn = document.querySelector('button.bg-secondary');
        if (saveBtn) {
            saveBtn.addEventListener('click', function() {
                const originalText = this.innerText;
                this.innerText = 'Salvando...';
                this.classList.add('opacity-90');
                this.disabled = true;
                
                setTimeout(() => {
                    this.innerText = 'Alterações Salvas!';
                    this.classList.remove('bg-secondary');
                    this.classList.add('bg-green-600');
                    
                    setTimeout(() => {
                        this.innerText = originalText;
                        this.classList.remove('bg-green-600', 'opacity-90');
                        this.classList.add('bg-secondary');
                        this.disabled = false;
                    }, 2000);
                }, 1000);
            });
        }
    </script>
