<body class="bg-background text-on-surface min-h-screen pb-24">
<!-- TopAppBar -->
<header class="sticky top-0 z-50 bg-surface-container-lowest dark:bg-inverse-surface shadow-sm flex items-center justify-between px-4 h-14 w-full">
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-transform hover:bg-surface-container-high dark:hover:bg-surface-variant p-2 rounded-full">
<span class="material-symbols-outlined text-primary dark:text-inverse-primary" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary dark:text-inverse-primary">Central de Ajuda</h1>
</div>
<button class="active:scale-95 transition-transform hover:bg-surface-container-high dark:hover:bg-surface-variant p-2 rounded-full">
<span class="material-symbols-outlined text-primary dark:text-inverse-primary" data-icon="search">search</span>
</button>

<main class="px-gutter pt-6 space-y-8">

<section>

</div>
</section>

<section class="space-y-4">

<button class="flex flex-col items-start p-4 bg-surface-container-lowest rounded-xl custom-shadow active-interaction text-left">
<span class="material-symbols-outlined text-secondary mb-3" data-icon="local_shipping">local_shipping</span>
<span class="font-label-lg text-label-lg">Minhas Entregas</span>
</button>
<button class="flex flex-col items-start p-4 bg-surface-container-lowest rounded-xl custom-shadow active-interaction text-left">
<span class="material-symbols-outlined text-secondary mb-3" data-icon="payments">payments</span>
<span class="font-label-lg text-label-lg">Pagamentos e Ganhos</span>
</button>
<button class="flex flex-col items-start p-4 bg-surface-container-lowest rounded-xl custom-shadow active-interaction text-left">
<span class="material-symbols-outlined text-secondary mb-3" data-icon="person">person</span>

</button>
<button class="flex flex-col items-start p-4 bg-surface-container-lowest rounded-xl custom-shadow active-interaction text-left">

</button>
<div class="col-span-2">
<button class="w-full flex items-center justify-between p-4 bg-surface-container-lowest rounded-xl custom-shadow active-interaction">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary" data-icon="directions_car">directions_car</span>

</div>

</button>
</div>
</div>
</section>
<!-- FAQs -->

<button class="w-full flex items-center justify-between p-4 bg-surface-container-lowest rounded-xl active-interaction border border-outline-variant/30">
<span class="font-body-md text-body-md text-left">Como solicitar um saque?</span>

</button>
<button class="w-full flex items-center justify-between p-4 bg-surface-container-lowest rounded-xl active-interaction border border-outline-variant/30">
<span class="font-body-md text-body-md text-left">O que fazer em caso de extravio?</span>

</button>
<button class="w-full flex items-center justify-between p-4 bg-surface-container-lowest rounded-xl active-interaction border border-outline-variant/30">
<span class="font-body-md text-body-md text-left">Como alterar meu veículo?</span>

</button>
<button class="w-full flex items-center justify-between p-4 bg-surface-container-lowest rounded-xl active-interaction border border-outline-variant/30">

</button>
</div>
</section>
<!-- Real-time Support CTA -->
<section class="mt-8">
<div class="relative overflow-hidden bg-primary-container text-on-primary rounded-2xl p-6 flex flex-col items-center text-center gap-4">
<!-- Abstract visual element using CSS -->
<div class="absolute -right-10 -top-10 w-40 h-40 bg-secondary/10 rounded-full blur-3xl"></div>
<div class="absolute -left-10 -bottom-10 w-40 h-40 bg-on-secondary-container/10 rounded-full blur-3xl"></div>

                    Falar com Atendente
                </button>

<!-- Deliveries -->
<div class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-5 py-1 hover:text-primary dark:hover:text-primary-fixed-dim active:scale-90 transition-all duration-200 cursor-pointer">
<span class="material-symbols-outlined" data-icon="local_shipping">local_shipping</span>
<span class="font-label-sm text-label-sm">Deliveries</span>
</div>
<!-- Earnings -->

<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-sm text-label-sm">Account</span>
</div>

<script>
        // Simple micro-interaction for FAQ toggles
        document.querySelectorAll('button[class*="border-outline-variant"]').forEach(button => {
            button.addEventListener('click', function() {
                const icon = this.querySelector('.material-symbols-outlined:last-child');
                if (icon.innerText === 'add') {
                    icon.innerText = 'remove';
                    this.classList.add('bg-surface-container-low');
                } else {
                    icon.innerText = 'add';
                    this.classList.remove('bg-surface-container-low');
                }
            });
        });

        // Search bar ripple/focus effect simulation
        const searchInput = document.querySelector('input[type="text"]');
        searchInput.addEventListener('focus', () => {
            searchInput.parentElement.classList.add('scale-[1.02]');
        });
        searchInput.addEventListener('blur', () => {
            searchInput.parentElement.classList.remove('scale-[1.02]');
        });
    </script>
