<body class="bg-background text-on-background font-body no-scrollbar">
<div class="flex flex-col min-h-screen max-w-md mx-auto bg-surface-container-lowest shadow-xl relative overflow-hidden">
<!-- Top Bar Substitution for Task Flow (Custom minimal Header) -->

<input class="w-14 h-16 text-center text-2xl font-bold border-0 border-b-2 border-outline-variant focus:border-secondary focus:ring-0 bg-surface-container-low transition-all rounded-t-lg" inputmode="numeric" maxlength="1" pattern="\d*" type="text">

</button>

</button>

</div>
<!-- Primary Action -->
<button class="w-full py-4 bg-primary text-on-primary font-bold text-lg rounded-xl shadow-lg hover:bg-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                Confirmar Entrega
                <span class="material-symbols-outlined">check_circle</span>
</button>

<!-- Footer / Navigation -->
<!-- Excluding BottomNavBar as it is a Focused View (Form-heavy/Process screen) per Rule 2 -->
<footer class="p-4 text-center">
<p class="text-xs text-on-surface-variant italic">Localização rastreada para segurança da entrega</p>
</footer>
</div>
<script>
        // Micro-interaction for OTP Inputs
        const inputs = document.querySelectorAll('#otp-container input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.inputType === 'deleteContentBackward') {
                    if (index > 0) inputs[index - 1].focus();
                    return;
                }
                
                if (input.value.length > 0) {
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && input.value.length === 0 && index > 0) {
                    inputs[index - 1].focus();
                }
            });

            input.addEventListener('focus', () => {
                input.select();
            });
        });

        // Simple button click feedback
        document.querySelector('button.bg-primary').addEventListener('click', function() {
            const btn = this;
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Processando...';
            btn.disabled = true;
            btn.classList.add('opacity-80');
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">done_all</span> Sucesso!';
                btn.classList.remove('bg-primary');
                btn.classList.add('bg-green-600');
            }, 1500);
        });
    </script>
