<script>
        // Micro-interactions for form feedback
        const inputs = document.querySelectorAll('input[type="password"]');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('ring-2', 'ring-secondary/20');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('ring-2', 'ring-secondary/20');
            });
        });

        // Toggle Password Visibility
        const visibilityBtns = document.querySelectorAll('button:has(.material-symbols-outlined[data-icon="visibility"])');
        visibilityBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const input = btn.previousElementSibling;
                const icon = btn.querySelector('.material-symbols-outlined');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = 'visibility_off';
                    icon.setAttribute('data-icon', 'visibility_off');
                } else {
                    input.type = 'password';
                    icon.textContent = 'visibility';
                    icon.setAttribute('data-icon', 'visibility');
                }
            });
        });

        // Simple button active state handler
        const primaryBtn = document.querySelector('button:has(.material-symbols-outlined[data-icon="save"])');
        primaryBtn.addEventListener('click', () => {
            const originalContent = primaryBtn.innerHTML;
            primaryBtn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Gravando...';
            primaryBtn.disabled = true;
            setTimeout(() => {
                primaryBtn.innerHTML = '<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span> Alterações Salvas';
                primaryBtn.classList.replace('bg-secondary', 'bg-on-secondary-container');
                setTimeout(() => {
                    primaryBtn.innerHTML = originalContent;
                    primaryBtn.classList.replace('bg-on-secondary-container', 'bg-secondary');
                    primaryBtn.disabled = false;
                }, 2000);
            }, 1200);
        });
    </script>
