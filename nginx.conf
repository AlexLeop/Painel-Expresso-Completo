events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=webhooks:10m rate=20r/s;
    map $http_x_forwarded_proto $upstream_forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    upstream django_backend {
        server django:8000;
    }

    upstream fast_lane {
        server fastapi:8001;
    }

    upstream frontend {
        server frontend:5173;
    }

    server {
        listen 80;
        server_tokens off;
        client_max_body_size 5m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

        location ^~ /admin/ {
            return 404;
        }

        # Rota de Telemetria de Altíssima Performance vai para o FastAPI
        location /telemetry {
            proxy_pass http://fast_lane;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        }

        # Frontend SPA
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        }

        location ~ ^/api/v1/(integration/webhooks/|webhooks/) {
            limit_req zone=webhooks burst=40 nodelay;
            proxy_pass http://django_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        }

        # Backend API Django
        location /api/ {
            proxy_pass http://django_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        }

        # Somente ativos públicos de marca. Documentos e provas nunca são servidos
        # diretamente pelo proxy; exigem endpoint autorizado/URL assinada.
        location /media/branding/ {
            alias /app/media/branding/;
            autoindex off;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "public, max-age=86400";
        }

        location /media/ {
            return 404;
        }
        
        # Arquivos estáticos do Django (Admin)
        location /static/ {
            alias /app/static/;
        }
    }
}
