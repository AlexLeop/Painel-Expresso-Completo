[pytest]
DJANGO_SETTINGS_MODULE = tests.test_settings
testpaths = backend/tests backend/accounts backend/finance backend/integration backend/logistics backend/todos
python_files = tests.py test_*.py *_tests.py
pythonpath = backend
addopts = -v --tb=short -p backend.tests.gdal_mock_plugin
norecursedirs = .git .pytest_cache .venv __pycache__ backend/scripts
markers =
    vps_db: external VPS database checks; requires RUN_LIVE_VPS_TESTS=1 and LIVE_VPS_DATABASE_URL
